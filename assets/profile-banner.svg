<svg width="900" height="380" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Tahsin Kamal Rohan profile banner">
  <defs>
    <linearGradient id="windowBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f0f"/>
      <stop offset="100%" stop-color="#020505"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#052e2b"/>
      <stop offset="55%" stop-color="#03181a"/>
      <stop offset="100%" stop-color="#010405"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="15%" r="75%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#2dd4bf" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <clipPath id="avatarClip">
      <circle cx="98" cy="150" r="46"/>
    </clipPath>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- outer window -->
  <rect x="1" y="1" width="898" height="378" rx="22" fill="url(#windowBg)" stroke="#134e4a" stroke-opacity="0.5"/>

  <!-- title bar -->
  <circle cx="34" cy="34" r="6" fill="#f87171"/>
  <circle cx="56" cy="34" r="6" fill="#fbbf24"/>
  <circle cx="78" cy="34" r="6" fill="#34d399"/>
  <text x="900" y="39" text-anchor="end" transform="translate(-30,0)" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="3" fill="#5eead4" fill-opacity="0.7">GITHUB PROFILE</text>
  <line x1="1" y1="58" x2="899" y2="58" stroke="#134e4a" stroke-opacity="0.4"/>

  <!-- glow card -->
  <g>
    <rect x="26" y="80" width="848" height="278" rx="18" fill="#03100f" filter="url(#softBlur)" opacity="0.6"/>
    <rect x="26" y="80" width="848" height="278" rx="18" fill="url(#cardBg)"/>
    <rect x="26" y="80" width="848" height="278" rx="18" fill="url(#glow)"/>
    <rect x="26.5" y="80.5" width="847" height="277" rx="17.5" fill="none" stroke="#2dd4bf" stroke-opacity="0.35"/>

    <!-- avatar -->
    <circle cx="98" cy="150" r="49" fill="none" stroke="url(#ring)" stroke-width="2"/>
    <image href="https://avatars.githubusercontent.com/u/143657752?v=4" x="52" y="104" width="92" height="92" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>

    <!-- handle -->
    <text x="166" y="122" font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="1" fill="#5eead4">@RohanKamal123</text>

    <!-- name -->
    <text x="164" y="163" font-family="Verdana, Segoe UI, sans-serif" font-size="34" font-weight="700" fill="#e6fffb">Tahsin Kamal Rohan</text>

    <!-- bio -->
    <text x="166" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9fb9b6">
      <tspan x="166" dy="0">B.Sc. Data Science student at UIU, Bangladesh &#8226; building in AI, NLP &amp; ML</tspan>
      <tspan x="166" dy="24">Proficient in Python &amp; PyTorch &#8226; sharing AI projects on GitHub</tspan>
    </text>

    <!-- pills -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
      <g>
        <rect x="52" y="246" width="88" height="34" rx="17" fill="#04211f" stroke="#2dd4bf" stroke-opacity="0.55"/>
        <text x="96" y="268" text-anchor="middle" fill="#99f6e4">Python</text>
      </g>
      <g>
        <rect x="152" y="246" width="118" height="34" rx="17" fill="#04211f" stroke="#2dd4bf" stroke-opacity="0.55"/>
        <text x="211" y="268" text-anchor="middle" fill="#99f6e4">JavaScript</text>
      </g>
      <g>
        <rect x="282" y="246" width="86" height="34" rx="17" fill="#04211f" stroke="#2dd4bf" stroke-opacity="0.55"/>
        <text x="325" y="268" text-anchor="middle" fill="#99f6e4">HTML</text>
      </g>
      <g>
        <rect x="380" y="246" width="78" height="34" rx="17" fill="#04211f" stroke="#2dd4bf" stroke-opacity="0.55"/>
        <text x="419" y="268" text-anchor="middle" fill="#99f6e4">CSS</text>
      </g>
      <g>
        <rect x="470" y="246" width="98" height="34" rx="17" fill="#04211f" stroke="#2dd4bf" stroke-opacity="0.55"/>
        <text x="519" y="268" text-anchor="middle" fill="#99f6e4">PyTorch</text>
      </g>
    </g>

    <text x="852" y="340" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#2dd4bf" fill-opacity="0.5">github.com/RohanKamal123</text>
  </g>
</svg>
