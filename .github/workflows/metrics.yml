name: Metrics

# Renders the 3D isometric contribution calendar into assets/metrics.isocalendar.svg,
# committed back to this repo so the README can display it.
#
# SETUP (one time): this needs a personal access token so it can read your
# contribution history.
#   1. Create a classic PAT at https://github.com/settings/tokens with the
#      `repo` scope (and `read:user`). No expiry, or set a reminder to rotate it.
#   2. Add it to this repo as a secret named METRICS_TOKEN:
#      Settings -> Secrets and variables -> Actions -> New repository secret.
# Until the secret exists the job will fail harmlessly and the README simply
# won't show the calendar image.

on:
  schedule:
    - cron: "0 */6 * * *"     # every 6 hours
  push:
    branches:
      - claude/github-profile-design-vqpwit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  isocalendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: RohanKamal123
          filename: assets/metrics.isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Dhaka
          committer_message: "chore: refresh isometric contribution calendar"
