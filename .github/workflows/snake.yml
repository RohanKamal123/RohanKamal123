name: Generate Snake

# Renders the contribution graph as a snake game and pushes the SVGs to the
# `output` branch, which the README pulls from. Works out of the box with the
# default GITHUB_TOKEN - no extra secrets needed.

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  push:
    branches:
      - main
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=#39d353

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
